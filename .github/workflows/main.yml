name: Build Offline Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Pixel Lane MOBA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android Gradle Project
        run: |
          python3 - <<'PYEOF'
          import os, glob, shutil, struct, zlib, zipfile

          if os.path.exists("app/build.gradle.kts"):
              print("Full Android Gradle project detected.")
              raise SystemExit(0)

          zip_files = [f for f in sorted(glob.glob("*.zip")) if os.path.isfile(f)]
          if zip_files:
              zpath = zip_files[0]
              print(f"Extracting uploaded archive: {zpath}")
              with zipfile.ZipFile(zpath, "r") as zf:
                  for member in zf.infolist():
                      if member.is_dir() or member.filename.startswith(".github/"):
                          continue
                      target = os.path.normpath(member.filename)
                      if target.startswith("..") or os.path.isabs(target):
                          continue
                      parent = os.path.dirname(target)
                      if parent:
                          os.makedirs(parent, exist_ok=True)
                      with zf.open(member) as src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst)
              if os.path.exists("app/build.gradle.kts"):
                  print("Extracted full Android Gradle project from ZIP.")
                  raise SystemExit(0)

          html_source = "index.html" if os.path.exists("index.html") else next(
              (f for f in sorted(glob.glob("*.html")) if os.path.isfile(f)), None
          )
          if not html_source:
              raise FileNotFoundError("No HTML game file or Android ZIP found in repo root.")

          for d in [
              "app/src/main/assets/www",
              "app/src/main/java/com/pixellane/moba",
              "app/src/main/res/values",
              "app/src/main/res/mipmap-xxxhdpi",
          ]:
              os.makedirs(d, exist_ok=True)

          shutil.copyfile(html_source, "app/src/main/assets/www/index.html")

          def wf(path, content):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          wf("settings.gradle.kts", '''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "pixel-lane-moba"
          include(":app")
          ''')
          wf("build.gradle.kts", '''plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          ''')
          wf("gradle.properties", '''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          ''')
          wf("app/build.gradle.kts", '''plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.pixellane.moba"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.pixellane.moba"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          ''')
          wf("app/proguard-rules.pro", '''# Keep WebView JavaScript interfaces if added later
          -keepattributes *Annotation*
          ''')
          wf("app/src/main/AndroidManifest.xml", '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Offline-only mode: INTERNET permission intentionally omitted -->
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          ''')
          wf("app/src/main/res/values/strings.xml", '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Pixel Lane MOBA</string>
          </resources>
          ''')
          wf("app/src/main/res/values/styles.xml", '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">#0B0D16</item>
                  <item name="android:colorBackground">#0B0D16</item>
              </style>
          </resources>
          ''')
          wf("app/src/main/java/com/pixellane/moba/MainActivity.java", '''package com.pixellane.moba;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final String GAME_ASSET_URL = "file:///android_asset/www/index.html";
              private WebView webView;
              private long lastBackPressMs = 0L;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  applyImmersiveMode();

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0B0D16"));
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  webView.setHorizontalScrollBarEnabled(false);
                  webView.setVerticalScrollBarEnabled(false);
                  webView.setLongClickable(false);
                  webView.setOnLongClickListener(v -> true);

                  configureWebSettings(webView.getSettings());

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          return !(url.startsWith("file://") || url.startsWith("about:") || url.startsWith("data:"));
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl(GAME_ASSET_URL);
              }

              @SuppressWarnings("deprecation")
              private void configureWebSettings(WebSettings settings) {
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
              }

              private void applyImmersiveMode() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      getWindow().setDecorFitsSystemWindows(false);
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(
                                  WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                  } else {
                      applyLegacyImmersiveFlags();
                  }
              }

              @SuppressWarnings("deprecation")
              private void applyLegacyImmersiveFlags() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      applyImmersiveMode();
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  long now = System.currentTimeMillis();
                  if (now - lastBackPressMs < 2000L) {
                      super.onBackPressed();
                  } else {
                      lastBackPressMs = now;
                      Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) {
                      webView.onResume();
                  }
              }

              @Override
              protected void onPause() {
                  if (webView != null) {
                      webView.onPause();
                  }
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          ''')

          def write_icon(path):
              size, scale = 192, 12
              px = bytearray([11, 13, 22, 255] * (size * size))
              def fill_rect(gx, gy, gw, gh, rgba):
                  for y in range(gy * scale, (gy + gh) * scale):
                      for x in range(gx * scale, (gx + gw) * scale):
                          i = (y * size + x) * 4
                          px[i:i+4] = bytes(rgba)
              fill_rect(1, 1, 14, 1, (27, 34, 64, 255))
              fill_rect(1, 14, 14, 1, (27, 34, 64, 255))
              fill_rect(1, 1, 1, 14, (27, 34, 64, 255))
              fill_rect(14, 1, 1, 14, (27, 34, 64, 255))
              fill_rect(2, 10, 4, 4, (25, 53, 42, 255))
              fill_rect(10, 2, 4, 4, (25, 53, 42, 255))
              for k in range(3, 13):
                  fill_rect(k, 15 - k, 1, 1, (29, 78, 216, 255))
              for k in range(4, 12):
                  fill_rect(k, k, 1, 1, (226, 232, 240, 255))
              accent = (251, 191, 36, 255)
              fill_rect(3, 11, 2, 2, accent)
              fill_rect(11, 3, 2, 2, accent)
              fill_rect(7, 7, 2, 2, (255, 255, 255, 255))
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              raw = bytearray()
              for y in range(size):
                  raw.append(0)
                  raw.extend(px[y * size * 4:(y + 1) * size * 4])
              with open(path, "wb") as f:
                  f.write(b"\x89PNG\r\n\x1a\n")
                  f.write(chunk(b"IHDR", struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)))
                  f.write(chunk(b"IDAT", zlib.compress(bytes(raw), 9)))
                  f.write(chunk(b"IEND", b""))

          write_icon("app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          print(f"Generated offline Android project from {html_source}")
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SDK_MGR="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null || true
            "$SDK_MGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (Installable Offline)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-lane-moba-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
