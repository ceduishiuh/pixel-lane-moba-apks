 if(th.length&&(hp<.65||eng||th.some(o=>o.rg<60))){ca_(h,1,esc(h,th,110));return}

  const ok=la.nh>=2||(la.nh>=1&&(ice?(chase||eng||ck||smLow(la.a)<.5):(eng||ck||(mnP(h)>.5&&!tw)||smLow(la.a)<.6)));

/* ---------------- LEVIATHAN: tank. Gush the carry, smash to weaken, Ravage to stun the team ---------------- */
function levAI2(h,tg,E,A,ec,eng,ck){

 if(st.length){
  const prio=st.some(o=>n6p(o)>=2),hurt=X.al.some(a=>a.hp<a.mh*.5&&st.some(o=>D(o,a)<150));
  const go=st.length>=2||(st.length==1&&(eng||ck)&&(prio||hp<.5||hurt||X.al.length>=1||st[0].hp<dm(h,2)))||hp<.4;
  if(go&&!(tw&&st.length<2&&!ck)){cast(h,2);return}}
}
if(rdy(h,1)&&!(h.lvSp>0)){
 const n=hv.filter(o=>dd(h,o)<rS-8).length,c=crs.filter(o=>D(o,h)<rS-6).length;
 const dps=hv.some(o=>dd(h,o)<rS-8&&(n6p(o)>=2||o.ad*o.as>70));
 if((n>=1&&(eng||ck||n>=2||dps||hp<.6))||c>=4){cast(h,1);return}
}
if(rdy(h,0)){
 const sc=o=>n6p(o)*1.2+(1-smLow(o))*2+(o.lvSlT>T?-2:0)+(o.lvArT>T?-1.5:0)+(dd(h,o)>100?1:0);
 const t=hv.filter(o=>dd(h,o)<160).sort((a,b)=>sc(b)-sc(a))[0];
 if(t&&(eng||ck||dd(h,t)>100||smLow(t)<.5||t.rg>=60)&&!(t.lvSlT>T&&t.lvArT>T&&smLow(t)>.5)){ca_(h,0,{x:t.x,y:t.y});return}
}
petrify(h,hv,2);
}

/* ---------------- DR. VANCE: poke for rage with bolts, transform in the fight, then leap -> Worldbreaker -> clap ---------------- */
function vncAI2(h,tg,E,A,ec,eng,ck){
if(h.st>0||h.vnWB||h.vnLp||h.vnCl)return;
const X=ctx(h,E),hv=X.hv,hp=X.hp,tw=X.tw,ti=h.vnT>0,rg=h.vnR||0;
const nbH=(o,r)=>hv.filter(e=>e!==o&&M.hypot(e.x-o.x,(e.y-o.y)*1.5)<(r||110)).length;
if(!ti){
 if(rdy(h,2)&&rg>=99.5){
  const n150=hv.filter(o=>dd(h,o)<=150).length,n200=hv.filter(o=>dd(h,o)<=200).length;
  if((n150>=1&&(eng||ck||hp<.75||n150>=2))||(n200>=2&&eng)||(X.al.length>=1&&eng&&n200>=1)){cast(h,2);return}}
 if(rdy(h,1)){

 if(rdy(h,0)){
  const la=lineAim(h,E,205,12,.3);
  if(la&&la.nh>=1&&(!tw||eng||ck)&&!(hp<.35&&hv.some(o=>o.rg<60&&dd(h,o)<100))){ca_(h,0,la.p);return}}
 return}
/* TITAN FORM */
if(rdy(h,2)&&rg>=35){
 const nt=hv.filter(o=>dd(h,o)<125&&!(o.blk>0)&&!o.mega)[0],cl=hv.filter(o=>dd(h,o)<125).length;
 if(nt&&hv[0]===nt&&(eng||ck||hp<.7||smLow(nt)<.7)&&(n6p(nt)>=1.2||smLow(nt)<.5||cl==1)&&!(X.outn&&hp<.4)){cast(h,2);return}}
if(rdy(h,1)&&!(tw&&!ck)){
 const t=hv.filter(o=>{const d=dd(h,o);return d>=95&&d<=190&&!(o.blk>0)}).map(o=>({o,s:n6p(o)*1.5+(1-smLow(o))*3+nbH(o,80)*1.2})).sort((a,b)=>b.s-a.s)[0];
 if(t&&(eng||ck||smLow(t.o)<.6)&&!(X.outn&&hp<.5)){ca_(h,1,pr_(t.o,.3));return}}
if(rdy(h,0)&&!(tw&&!ck&&!eng)){
 const hh=hv.filter(o=>dd(h,o)<=118),cr=E.filter(o=>o.t=='c'&&!o.jg&&!o.dead&&dd(h,o)<=118);
 if(hh.length>=2||(hh.length&&(eng||ck||smLow(hh[0])<.7))||(cr.length>=4&&!hv.length)){ca_(h,0,pr_(hh[0]||cr[0],.15));return}}
petrify(h,hv,2);
}

/* ---------------- BAMF: assassin. Pick isolated/killable targets, keep a blink charge to flee, barrage to finish or fight ---------------- */
function bfAI2(h,tg,E,A,ec,eng,ck){
if(h.st>0||h.bfFl||h.bfU)return;
const X=ctx(h,E),hv=X.hv,hp=X.hp,tw=X.tw,ch=h.bfC==null?2:h.bfC,base=HQ(h.team);
const nbH=(o,r)=>hv.filter(e=>e!==o&&M.hypot(e.x-o.x,(e.y-o.y)*1.5)<(r||150)).length;
const val=o=>(1-smLow(o))*4+n6p(o)*.8-nbH(o)*.6-dd(h,o)/160;
const e0=dm(h,0),e1=dm(h,1)*1.5,e2=dm(h,2)*.8;
/* expected single-target damage of the full combo (barrage hops are shared between targets in the cluster) */
const burst=(o,u)=>ph(o,e1+(ch>0?e0:0)+(u?e2*M.max(1.5,5/(1+nbH(o,125))):0));
const ultR=rdy(h,2);
const kl=o=>o.hp<burst(o,ultR)*.9;
if(ultR){let best=null,bs=0;
 for(const o of hv){if(dd(h,o)>195)continue;const n=1+nbH(o,125),k=o.hp<ph(o,e2*M.max(1.5,5/n))*.95;
  if(!(n>=2||ck||k||(eng&&smLow(o)<.55)||smLow(o)<.4))continue;
  if(hp<.25&&!k&&n<2)continue;if(tw&&!k&&n<3)continue;
  const s=n*3+(1-smLow(o))*3+n6p(o)*.5+(k?4:0);if(s>bs){bs=s;best=o}}
 if(best){ca_(h,2,pr_(best,.3));return}}
if(rdy(h,0)&&ch>0&&base&&(((hp<.35||(X.outn&&hp<.45))&&hv.some(o=>dd(h,o)<150))||(tw&&hp<.5))){
 const dx=base.x-h.x,dy=base.y-h.y,l=M.hypot(dx,dy*1.5)||1;ca_(h,0,clampP(h.x+dx/l*150,h.y+dy/l*150/1.5));return}
if(rdy(h,1)){
 const t=hv.filter(o=>dd(h,o)<=82).sort((a,b)=>val(b)-val(a))[0];
 if(t&&(eng||ck||smLow(t)<.8)&&!(X.outn&&hp<.5&&!kl(t))){ca_(h,1,pr_(t,.1));return}}
if(rdy(h,0)&&ch>0&&!(tw&&!ck)){
 const t=hv.filter(o=>dd(h,o)>55&&dd(h,o)<=160&&!(o.blk>0)).sort((a,b)=>(val(b)+(kl(b)?3:0))-(val(a)+(kl(a)?3:0)))[0];
 if(t){const k=kl(t);
  if((ch>=2||ck||k||smLow(t)<.35)&&(eng||ck||k||smLow(t)<.55)&&(nbH(t)<=1||ck||k||smLow(t)<.35)&&!(X.outn&&!k)&&!(tw&&!k)){ca_(h,0,pr_(t,0));return}}}
petrify(h,hv,2);
}

(function(){
let PSEL=null,snap=0;
const key=x=>x[0]=='s'?'sup':x;
const cands=r=>[CLSB[r]||CLS[r]].concat(RL2[r]||[]);
const ecl=(r,x)=>cands(r).find(c=>c&&SLC[key(x)].includes(c))||CLSB[r]||CLS[r];
/* team builder: the chosen hero takes the chosen slot; bots may fill a slot with a secondary role / extra lane */
let SL0=null;const MIR={off:'car',car:'off',mid:'mid',supO:'supC',supC:'supO'};
PTF=function(tm,n,U,f){
let sl=['mid','car','off','supC','supO'].slice(0,n);const out=[],C=new Set(),used=[];
/* enemy team mirrors the slots (= lanes) the player's team ended up with, so both sides always have the same heroes per lane */
if(tm==1&&SL0&&SL0.length==n)sl=SL0.map(x=>MIR[x]);
const fit=(r,x)=>{const k=key(x);return cands(r).some(c=>SLC[k].includes(c))||(k!='sup'&&(HRX[r]||[]).includes(SLL[tm][x]))};
if(f){let x=tm==0&&PSEL&&PSEL.h==f?PSEL.slot:null;
 if(!x){const pr=SLP[CLS[f]];x=pr.find(q=>sl.includes(q));if(!x){x=pr[0];sl=sl.slice(0,n-1)}else sl=sl.filter(q=>q!=x)}
 else{if(sl.includes(x))sl=sl.filter(q=>q!=x);else{/* player took a lane slot outside the default set: drop the slot that is easiest to cover, keep a balanced spread */
   const alt={supO:['supC','off'],supC:['supO','car']},drop=(alt[x]||[]).find(q=>sl.includes(q))||sl[sl.length-1];sl=sl.filter(q=>q!=drop)}}
 used.push(x);out.push({r:f,l:SLL[tm][x],s:SLN[x]});U.add(f);C.add(CLS[f])}
for(const x of sl){const k=key(x);used.push(x);
 let pool=RN.filter(r=>!U.has(r)&&fit(r,x));
 if(!pool.length)pool=RN.filter(r=>!U.has(r)&&SLC[k].includes(CLSB[r]||CLS[r]));
 if(!pool.length)pool=RN.filter(r=>!U.has(r));
 const p2=pool.filter(r=>!C.has(ecl(r,x))||k=='sup'),a=p2.length?p2:pool,r=a[M.floor(R()*a.length)];
 U.add(r);CLS[r]=ecl(r,x);C.add(CLS[r]);out.push({r,l:SLL[tm][x],s:SLN[x]})}
if(tm==0)SL0=used.slice();
return out};

const ps=PSEL&&PSEL.h==role&&!tr?PSEL:null;if(!ps)PSEL=null;if(ps)CLS[role]=ps.role;
try{const r=_initRL(role,tr);
 try{if(ps&&P)fx.push({x:P.x,y:P.y-84,s:'ROLE: '+ps.role.toUpperCase(),t:4,c:'#9df'})}catch(e){}
 return r}finally{PSEL=null}};

const lanesTxt=MAPF?L.map(l=>LN[l]).join(' or '):'';
